name: Second Son Android local AOT
on:
  workflow_dispatch:
  push:
    branches: [feature/second-son-arm64-aot]
permissions:
  contents: read
  actions: read
concurrency:
  group: iss-local-aot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Checkout renderer dependencies
        run: git submodule update --init --depth 1 -- port/gpu/third_party port/third_party/LibAtrac9
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41512987210
          name: iss-android-bionic-perf-apk-6fc684061cd3307c314ad9e0c37683bbb46f1645
          path: inputs/iss
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: erickmendes22/ShadowOfTheColossus-Android-Aot
          run-id: 45109431755
          name: Shadow-of-the-Colossus-Daedalus-AOT-0.2.0-NGS2-AUDIO-UNSIGNED
          path: inputs/shadow
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: iss-headers
          create-args: >-
            cmake ninja pkg-config libboost-headers=1.92 glslang spirv-tools vulkan-memory-allocator magic_enum
      - name: Build ISS GPU, native AOT CPU and game loader from source
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export ISS_NDK="$ANDROID_HOME/ndk/29.0.14206865" ISS_JOBS=3 ISS_BIONIC_HEADERS="$CONDA_PREFIX"
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          bash tools/android/bionic/build_deps.sh
          bash tools/android/bionic/build_native_runtime.sh --compile-only
          bash tools/android/bionic/build_gpu.sh
          git init -q out/bb-source
          git -C out/bb-source fetch -q --depth=1 https://github.com/ducvd89/Bloodborne-Android.git b6d4cfb6972c84d4029f54765406ec143df3c30e
          git -C out/bb-source checkout -q FETCH_HEAD
          ISS_AOT_UPSTREAM="$PWD/out/bb-source" bash tools/android/aot/build_native_cpu.sh
          bash tools/android/bionic/build_native_runtime.sh
          "$ISS_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded out/bionic/lib/*.so out/bionic/bin/iss-probe
      - name: Assemble APK from current sources and prepare signing request
        run: |
          set -euo pipefail
          python3 tools/android/aot/stage_ci.py inputs/iss/*.apk inputs/shadow/*.apk
          bash tools/android/aot/assemble_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iss-aot-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/aot-apk/request.cms
          if-no-files-found: error
          retention-days: 1
      - name: Sign and verify the update for the installed application
        env:
          GH_TOKEN: ${{ github.token }}
          ISS_AOT_KEYSTORE_B64: ${{ secrets.ISS_AOT_KEYSTORE_B64 }}
          ISS_AOT_KEY_PASSWORD: ${{ secrets.ISS_AOT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/35.0.0"
          cd out/aot-apk
          if [[ -n "$ISS_AOT_KEYSTORE_B64" ]]; then
            umask 077
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            printf '%s' "$ISS_AOT_KEYSTORE_B64" | base64 -d >"$key"
            "$bt/apksigner" sign --ks "$key" --ks-key-alias aot-local --ks-pass env:ISS_AOT_KEY_PASSWORD --v1-signing-enabled false --alignment-preserved true --out update.apk request.apk
          else
            echo "Encrypted build is ready for the private APK signing and delivery workflow." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$bt/apksigner" verify --verbose --print-certs update.apk >signers.txt
          grep -F 'certificate SHA-256 digest: a787209296559bd6ffe0d0790368b53cb64050f73e51d211d5bcb80b6b36f0b3' signers.txt
          "$bt/aapt" dump badging update.apk >badging.txt
          grep -F "package: name='com.daedalus.iss.aot.local'" badging.txt
          openssl cms -encrypt -binary -aes256 -outform DER -in update.apk -out delivery.cms ../../tools/android/aot/delivery-cert.pem
          sha256sum update.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('out/aot-apk/delivery.cms') != ''
        with:
          name: iss-aot-private-${{ github.run_id }}
          path: out/aot-apk/delivery.cms
          if-no-files-found: error
          retention-days: 14
